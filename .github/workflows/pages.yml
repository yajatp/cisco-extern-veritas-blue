name: Publish presentation

on:
  push:
    branches: [main]
    paths: ["glass-ocean/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: glass-ocean/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: glass-ocean
      - run: npm run build
        working-directory: glass-ocean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: glass-ocean/dist
      - uses: actions/deploy-pages@v4
        id: deployment
